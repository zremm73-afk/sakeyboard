name: Build SAKeyboard

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get AML headers
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git /tmp/aml
          mkdir -p AML_headers
          cp -r /tmp/aml/mod AML_headers/mod
          ls AML_headers/mod

      - name: Build with the Android NDK
        run: |
          "$ANDROID_NDK_LATEST_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk

      - uses: actions/upload-artifact@v4
        with:
          name: SAKeyboard
          path: |
            libs/arm64-v8a/libSAKeyboard.so
            keyboard_map.ini
