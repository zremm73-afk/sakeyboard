# GTA SA keyboard controls. One action per line: action=KEY1,KEY2
# Up to 4 keys per action. Press F12 in game to reload this file.
# Key names: A-Z, 0-9, F1-F12, SPACE, ENTER, TAB, ESC, SHIFT_LEFT,
# SHIFT_RIGHT, CTRL_LEFT, CTRL_RIGHT, ALT_LEFT, ALT_RIGHT, UP, DOWN,
# LEFT, RIGHT, PAGE_UP, PAGE_DOWN, HOME, END, NUMPAD0-9, COMMA, PERIOD...
# or a raw Android keycode number. Set log_keys=1 to print pressed keys
# to logcat (tag SAKeyboard).

[options]
camera_speed=64
camera_invert_x=0
camera_invert_y=0
log_keys=0

[on foot + vehicle]
walk_forward=W
walk_back=S
walk_left=A
walk_right=D
camera_up=UP
camera_down=DOWN
camera_left=LEFT
camera_right=RIGHT
jump=SPACE
sprint=SHIFT_LEFT
enter_exit_vehicle=F
crouch=C
fire=CTRL_LEFT
aim=ALT_LEFT
weapon_prev=Q
weapon_next=E
yes=Y
no=N

[vehicle]
accelerate=W
brake=S
handbrake=SPACE
horn=H
look_behind=B
